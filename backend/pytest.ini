[pytest]
testpaths = tests
asyncio_mode = auto
filterwarnings = ignore::DeprecationWarning
markers =
    realdata: makes live network requests to real news providers. Deselected by default;
        run with `pytest -m realdata`. These tests measure provider behaviour and may fail
        for reasons outside this codebase - that is the point of keeping them separate.
addopts = -m "not realdata" --strict-markers
