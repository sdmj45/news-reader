name: backend

# Runs the offline suite only. The real-data tests are deliberately excluded from CI: they
# make live requests to news publishers, and a red build caused by Le Monde having a bad
# afternoon teaches nobody anything. Run them locally with `pytest -m realdata`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
