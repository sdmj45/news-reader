name: ci

# Runs the offline suite only. The real-data tests are deliberately excluded from CI: they
# make live requests to news publishers, and a red build caused by Le Monde having a bad
# afternoon teaches nobody anything. Run them locally with `pytest -m realdata`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `build` runs `tsc -b` first, so this is the type check as well.
      - run: npm run build
      # `npm run e2e` is deliberately absent: it needs a browser binary, a running backend
      # and real collected news. See frontend/e2e/reader.spec.mjs.
